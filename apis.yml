aid: memory
name: Memory
description: >-
  Memory AS (operating as Timely, timely.com) is an Oslo, Norway based software
  company behind Timely, an AI-powered automatic time tracking and timesheet
  platform for consultancies, agencies, professional-services firms and SaaS
  teams. Its Memory tracking engine passively captures work across the apps a
  person uses and its AutoSheet feature auto-completes timesheets, letting teams
  auto-capture, auto-allocate and one-click approve time. Timely exposes a REST
  API at api.timelyapp.com (version 1.1) secured with OAuth 2.0 for building on
  accounts, projects, clients, users, events (time entries) and reports, and
  offers 90+ direct integrations with tools such as QuickBooks, Xero, Asana,
  Jira, GitHub, Slack, Google Calendar and Salesforce. The company is ISO
  27001:2022 certified and GDPR-aligned, backed by 500 Global.
